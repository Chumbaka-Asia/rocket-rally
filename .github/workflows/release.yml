name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build runtime ZIP
        run: |
          VERSION="${GITHUB_REF_NAME}"
          git archive --format=zip --prefix=rocket-rally/ -o "rocket-rally-${VERSION}.zip" HEAD

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME}"
          if gh release view "${VERSION}" >/dev/null 2>&1; then
            gh release upload "${VERSION}" \
              "rocket-rally-${VERSION}.zip#Rocket Rally (${VERSION} Runtime ZIP)" \
              "colouring-templates/rocket-rally-template.pdf#Printable Spacecraft Templates (PDF)" \
              --clobber
          else
            gh release create "${VERSION}" \
              "rocket-rally-${VERSION}.zip#Rocket Rally (${VERSION} Runtime ZIP)" \
              "colouring-templates/rocket-rally-template.pdf#Printable Spacecraft Templates (PDF)" \
              --title "Rocket Rally ${VERSION}" \
              --generate-notes
          fi
